name: codespell
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || github.actor_id }}
  cancel-in-progress: true

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: package.json,package-lock.json
          # aks: Azure Kubernetes Service, read as a typo for "ask".
          # fpr: the field name in `gpg --with-colons` output, matched
          #      literally by an awk pattern in the Linux install guide.
          ignore_words_list: erro,wasn,aks,fpr
